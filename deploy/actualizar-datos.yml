name: Actualizar datos de F1

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas (UTC)
  workflow_dispatch: {}      # también se puede lanzar a mano desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar resultados (Jolpica y OpenF1)
        run: python3 fetch_data.py
      - name: Exportar historial de predicciones
        run: python3 registro.py
      - name: Guardar cambios
        run: |
          git config user.name "f1-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data prices upgrades
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar datos $(date -u +%F\ %H:%M)"
            git push
          fi
